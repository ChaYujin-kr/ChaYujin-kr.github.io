<title id="t">Build and deploy pipeline</title><desc id="d">The blog is built by GitHub Actions and published to GitHub Pages. The gateway corpus and evaluation are built in Python, the TypeScript Workers code passes CI scans (gitleaks, osv-scanner, semgrep, zizmor, SBOM), and is deployed with wrangler using a scoped token. Quality regression runs manually.</desc>

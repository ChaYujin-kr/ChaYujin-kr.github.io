<title id="t">Blog AI Assistant runtime architecture</title><desc id="d">The blog chat panel sends a question with a Turnstile token to the Cloudflare ask-worker, which applies rate limits and guards, calls OpenAI and streams the answer back. Logs go through log-worker into D1, and the report-worker dashboard opens only behind Access login.</desc>

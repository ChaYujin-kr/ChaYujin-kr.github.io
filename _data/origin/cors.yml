# Chirpy v7.6.0의 _data/origin/cors.yml을 덮어씀 (2026-11-09)
# - Google Fonts 제거: 방문자 IP가 Google로 가지 않게. 웹폰트 자리는 직접 호스팅하는 Pretendard로.
# - CDN 라이브러리를 정확한 버전으로 고정(원본은 bootstrap@5 같은 주 버전만 → 방문 때마다 최신 5.x).
#   모두 공개 2주 이상 지난 버전. 테마를 올릴 때는 새 테마의 cors.yml과 비교해 다시 맞출 것.
# Resource Hints
resource_hints:
  - url: https://cdn.jsdelivr.net
    links:
      - rel: preconnect
      - rel: dns-prefetch

# Web Fonts
webfonts: /assets/fonts/pretendard/pretendardvariable-dynamic-subset.css

# Libraries

bootstrap:
  css: https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css

toc:
  css: https://cdn.jsdelivr.net/npm/tocbot@4.36.8/dist/tocbot.min.css
  js: https://cdn.jsdelivr.net/npm/tocbot@4.36.8/dist/tocbot.min.js

fontawesome:
  css: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css

search:
  js: https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js

mermaid:
  js: https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js

dayjs:
  js:
    common: https://cdn.jsdelivr.net/npm/dayjs@1.11.23/dayjs.min.js
    locale: https://cdn.jsdelivr.net/npm/dayjs@1.11.23/locale/:LOCALE.js
    relativeTime: https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/relativeTime.js
    localizedFormat: https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/localizedFormat.js

glightbox:
  css: https://cdn.jsdelivr.net/npm/glightbox@3.3.1/dist/css/glightbox.min.css
  js: https://cdn.jsdelivr.net/npm/glightbox@3.3.1/dist/js/glightbox.min.js

lazy-polyfill:
  css: https://cdn.jsdelivr.net/npm/loading-attribute-polyfill@2.1.1/dist/loading-attribute-polyfill.min.css
  js: https://cdn.jsdelivr.net/npm/loading-attribute-polyfill@2.1.1/dist/loading-attribute-polyfill.umd.min.js

clipboard:
  js: https://cdn.jsdelivr.net/npm/clipboard@2.0.11/dist/clipboard.min.js

mathjax:
  js: https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js
